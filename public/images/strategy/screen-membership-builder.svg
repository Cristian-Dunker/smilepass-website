  <!-- + Create new (purple) -->
  <rect x="528" y="144" width="174" height="88" rx="10" fill="#7D7AF2"/>
  <text x="615" y="184" class="ff" font-size="26" fill="#FFFFFF" font-weight="500" text-anchor="middle">+</text>
  <text x="615" y="210" class="ff" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Create New Plan</text>
  <!-- Essentials -->
  <rect x="716" y="144" width="174" height="88" rx="10" fill="#FFFFFF" stroke="#7D7AF2"/>
  <text x="803" y="194" class="ff" font-size="13" fill="#252156" font-weight="500" text-anchor="middle">Essential Plan</text>
  <!-- Comprehensive -->
  <rect x="904" y="144" width="174" height="88" rx="10" fill="#FFFFFF" stroke="#7D7AF2"/>
  <text x="991" y="188" class="ff" font-size="13" fill="#252156" font-weight="500" text-anchor="middle">Comprehensive</text>
  <text x="991" y="204" class="ff" font-size="13" fill="#252156" font-weight="500" text-anchor="middle">Plan</text>
  <!-- Premium -->
  <rect x="1092" y="144" width="174" height="88" rx="10" fill="#FFFFFF" stroke="#7D7AF2"/>
  <text x="1179" y="194" class="ff" font-size="13" fill="#252156" font-weight="500" text-anchor="middle">Premium Plan</text>

