  <text x="639" y="450" class="ff plan-name" text-anchor="middle">Adult Comprehensive</text>
  <text x="639" y="498" class="ff price" text-anchor="middle">$8.50</text>
  <text x="691" y="498" class="ff price-unit">/Week</text>
  <!-- inclusions -->
  <text x="540" y="546" class="ff bullet">✓ 2x Dental Cleans</text>
  <text x="540" y="568" class="ff bullet">✓ 2x Exams + X-Rays</text>
  <text x="540" y="590" class="ff bullet">✓ 15% off other treatments</text>
  <text x="540" y="612" class="ff bullet">✓ FREE Whitening Touch-Up</text>
  <text x="540" y="634" class="ff bullet">✓ Member-only event invites</text>
  <text x="540" y="656" class="ff bullet">✓ Priority booking</text>
  <!-- Edit button -->
  <rect x="588" y="700" width="100" height="36" rx="8" fill="#7D7AF2"/>
  <text x="638" y="722" class="ff btn-text" text-anchor="middle">✎ EDIT</text>

  <!-- Card 2: Family Care (highlighted) -->
  <rect x="788" y="328" width="270" height="448" rx="14" fill="#FFFFFF" stroke="#7D7AF2" stroke-width="2"/>
  <rect x="788" y="328" width="270" height="58" fill="#F1F0FD" rx="14"/>
  <rect x="788" y="370" width="270" height="16" fill="#F1F0FD"/>
  <text x="824" y="354" class="ff toggle-label">Accept New</text>
  <text x="824" y="370" class="ff toggle-label">Members</text>
  <rect x="978" y="346" width="40" height="22" rx="11" fill="#7D7AF2"/>
  <circle cx="1007" cy="357" r="8" fill="#FFFFFF"/>
  <rect x="900" y="394" width="46" height="18" rx="9" fill="#7D7AF2"/>
  <text x="923" y="407" class="ff" font-size="9.5" fill="#FFFFFF" font-weight="700" letter-spacing=".06em" text-anchor="middle">POPULAR</text>
  <text x="824" y="416" class="ff muted">87 family accounts</text>
  <text x="923" y="450" class="ff plan-name" text-anchor="middle">Family Care</text>
  <text x="923" y="498" class="ff price" text-anchor="middle">$12.00</text>
  <text x="985" y="498" class="ff price-unit">/Week</text>
  <text x="824" y="546" class="ff bullet">✓ All Adult Comprehensive</text>
  <text x="824" y="568" class="ff bullet">✓ 10% per dependent</text>
  <text x="824" y="590" class="ff bullet">✓ Free emergency for kids</text>
  <text x="824" y="612" class="ff bullet">✓ Annual fluoride for under-16s</text>
  <text x="824" y="634" class="ff bullet">✓ Sealants for kids on first visit</text>
  <text x="824" y="656" class="ff bullet">✓ Priority booking</text>
  <rect x="872" y="700" width="100" height="36" rx="8" fill="#7D7AF2"/>
  <text x="922" y="722" class="ff btn-text" text-anchor="middle">✎ EDIT</text>

  <!-- Card 3: Hygiene Only -->
  <rect x="1072" y="328" width="270" height="448" rx="14" fill="#FFFFFF" stroke="#E5E3F0"/>
  <rect x="1072" y="328" width="270" height="58" fill="#F4F2FB" rx="14"/>
  <rect x="1072" y="370" width="270" height="16" fill="#F4F2FB"/>
  <text x="1108" y="354" class="ff toggle-label">Accept New</text>
  <text x="1108" y="370" class="ff toggle-label">Members</text>
  <rect x="1262" y="346" width="40" height="22" rx="11" fill="#7D7AF2"/>
  <circle cx="1291" cy="357" r="8" fill="#FFFFFF"/>
  <text x="1108" y="416" class="ff muted">63 members</text>
  <text x="1207" y="450" class="ff plan-name" text-anchor="middle">Hygiene Essentials</text>
  <text x="1207" y="498" class="ff price" text-anchor="middle">$6.00</text>
  <text x="1257" y="498" class="ff price-unit">/Week</text>
  <text x="1108" y="546" class="ff bullet">✓ 2x Dental Cleans</text>
  <text x="1108" y="568" class="ff bullet">✓ 1x Exam + X-Rays</text>
  <text x="1108" y="590" class="ff bullet">✓ 10% off other treatments</text>
  <text x="1108" y="612" class="ff bullet">✓ Member-only event invites</text>
  <text x="1108" y="634" class="ff bullet" fill="#C2C0D8">— no whitening</text>
  <text x="1108" y="656" class="ff bullet" fill="#C2C0D8">— no priority booking</text>
  <rect x="1156" y="700" width="100" height="36" rx="8" fill="#7D7AF2"/>
  <text x="1206" y="722" class="ff btn-text" text-anchor="middle">✎ EDIT</text>
</svg>
