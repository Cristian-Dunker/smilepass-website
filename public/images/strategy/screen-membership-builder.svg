  <!-- Card 1: Adult Comprehensive -->
  <rect x="504" y="328" width="270" height="448" rx="14" fill="#FFFFFF" stroke="#E5E3F0"/>
  <rect x="504" y="328" width="270" height="58" fill="#F4F2FB" rx="14"/>
  <rect x="504" y="370" width="270" height="16" fill="#F4F2FB"/>
  <text x="540" y="354" class="ff toggle-label">Accept New</text>
  <text x="540" y="370" class="ff toggle-label">Members</text>
  <rect x="694" y="346" width="40" height="22" rx="11" fill="#7D7AF2"/>
  <circle cx="723" cy="357" r="8" fill="#FFFFFF"/>
