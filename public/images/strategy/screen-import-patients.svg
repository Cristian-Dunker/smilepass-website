<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 800" role="img" aria-label="SmilePass Import Patients">
  <defs>
    <style>
      .ff{font-family:'Inter','Helvetica Neue',Arial,sans-serif}
      .nav-mute{font-size:13px;fill:#7B789C;font-weight:400}
      .nav-active{font-size:13px;fill:#7D7AF2;font-weight:600}
      .h1{font-size:22px;fill:#252156;font-weight:600;letter-spacing:-.01em}
      .h2{font-size:15px;fill:#252156;font-weight:600}
      .lbl{font-size:11.5px;fill:#5F5C7F;font-weight:500;letter-spacing:.04em}
      .body{font-size:13.5px;fill:#5F5C7F;line-height:1.5}
      .step-num{font-size:13.5px;fill:#252156;font-weight:600}
      .field-val{font-size:13.5px;fill:#252156;font-weight:500}
      .muted{font-size:11.5px;fill:#7B789C}
      .ok{font-size:11.5px;fill:#0E8A4F;font-weight:600}
      .btn-text{font-size:12px;fill:#FFFFFF;font-weight:600;letter-spacing:.04em}
      .btn-line{font-size:12px;fill:#7D7AF2;font-weight:600;letter-spacing:.04em}
      .csv-link{font-size:13.5px;fill:#7D7AF2;font-weight:600}
    </style>
  </defs>
  <rect width="1366" height="800" fill="#F6F4FB"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="232" height="800" fill="#FFFFFF"/>
  <rect x="32" y="32" width="32" height="32" rx="8" fill="#7D7AF2"/>
  <text x="74" y="56" class="ff" font-size="20" fill="#252156" font-weight="700">SmilePass</text>
  <text x="40" y="125" class="ff nav-mute">⌂ Home</text>
  <text x="40" y="173" class="ff nav-mute">⌽ Membership</text>
  <text x="40" y="213" class="ff nav-mute">$ Payment Plan</text>
  <text x="40" y="253" class="ff nav-mute">◔ Reporting</text>
  <text x="40" y="745" class="ff nav-mute">? Support</text>
  <rect x="20" y="755" width="192" height="40" rx="8" fill="#F1F0FD"/>
  <text x="40" y="780" class="ff nav-active">⚙ Settings</text>

  <!-- Top action bar -->
  <rect x="252" y="20" width="1094" height="56" rx="14" fill="#FFFFFF" stroke="#E5E3F0"/>
  <circle cx="290" cy="48" r="18" fill="#7D7AF2"/>
  <text x="290" y="54" class="ff" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">+</text>
  <rect x="1024" y="32" width="132" height="32" rx="16" fill="#7D7AF2"/>
  <text x="1090" y="52" class="ff" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">UPGRADE NOW</text>
  <text x="1248" y="44" class="ff" font-size="12" fill="#252156" font-weight="600">Dr Test</text>
  <text x="1248" y="58" class="ff" font-size="10" fill="#7B789C">Practice owner</text>

  <!-- Settings sub-sidebar -->
  <rect x="252" y="92" width="232" height="690" rx="14" fill="#FFFFFF" stroke="#E5E3F0"/>
  <text x="276" y="128" class="ff nav-mute">⌕ My Profile</text>
  <text x="276" y="168" class="ff nav-mute">⌽ Logins &amp; Permissions</text>
  <text x="276" y="208" class="ff nav-mute">⌂ Company</text>
  <text x="276" y="248" class="ff nav-mute">⌖ Locations</text>
  <rect x="272" y="266" width="192" height="36" rx="8" fill="#F1F0FD"/>
  <text x="288" y="289" class="ff nav-active">↥ Import Patients</text>
  <text x="276" y="328" class="ff nav-mute">✎ Membership Builder</text>
  <text x="276" y="368" class="ff nav-mute">✎ Payment Plan Builder</text>
  <text x="276" y="408" class="ff nav-mute">⊕ Addons Builder</text>
  <text x="276" y="448" class="ff nav-mute">⌖ Custom Discounts &amp; Code</text>
  <text x="276" y="488" class="ff nav-mute">▤ Billing and Payout</text>
  <text x="276" y="528" class="ff nav-mute">⛌ Promotional Material</text>
  <text x="276" y="568" class="ff nav-mute">⌬ Subscription</text>
  <text x="276" y="608" class="ff nav-mute">⊗ Integrations</text>

  <!-- Main content card -->
  <rect x="504" y="92" width="842" height="690" rx="14" fill="#FFFFFF" stroke="#E5E3F0"/>
  <text x="528" y="138" class="ff h1">Add Your Patients To SmilePass</text>
  <text x="528" y="172" class="ff body">The Patient Upload functionality simplifies the process of integrating your</text>
  <text x="528" y="190" class="ff body">existing patients with SmilePass. Securely upload basic patient information</text>
  <text x="528" y="208" class="ff body">(name, email, phone, date of birth) using the pre-designed template.</text>

  <!-- How it works -->
  <text x="528" y="248" class="ff h2">How It Works:</text>
  <text x="528" y="278" class="ff step-num">1.</text>
  <text x="550" y="278" class="ff field-val" font-weight="600">Download the Template:</text>
  <text x="704" y="278" class="ff body">use the provided template to add patient information.</text>
  <text x="528" y="302" class="ff step-num">2.</text>
  <text x="550" y="302" class="ff field-val" font-weight="600">Fill in Basic Details:</text>
  <text x="688" y="302" class="ff body">name, email, phone, address, date of birth.</text>
  <text x="528" y="326" class="ff step-num">3.</text>
  <text x="550" y="326" class="ff field-val" font-weight="600">Upload the File:</text>
  <text x="654" y="326" class="ff body">save the file in .csv format and upload below.</text>
  <text x="528" y="350" class="ff step-num">4.</text>
  <text x="550" y="350" class="ff field-val" font-weight="600">Submit:</text>
  <text x="606" y="350" class="ff body">click the submit button and we'll process your data.</text>

  <!-- Template download row -->
  <text x="528" y="394" class="ff h2">Download the Template</text>
  <rect x="528" y="408" width="794" height="48" rx="10" fill="#F1F0FD" stroke="#7D7AF2" stroke-dasharray="4 4"/>
  <text x="552" y="438" class="ff csv-link">↓ Template Patient List.csv</text>
  <text x="1302" y="438" class="ff muted" text-anchor="end">CSV · 2.3 KB · 5 columns</text>

  <!-- File upload -->
  <text x="528" y="488" class="ff h2">File Upload</text>
  <text x="528" y="506" class="ff body">Upload your Completed File (Supported Format: .csv):</text>
  <rect x="528" y="520" width="794" height="100" rx="10" fill="#FFFFFF" stroke="#E5E3F0" stroke-dasharray="6 6"/>
  <circle cx="925" cy="558" r="20" fill="#F1F0FD"/>
  <text x="925" y="564" class="ff" font-size="18" fill="#7D7AF2" font-weight="600" text-anchor="middle">↥</text>
  <text x="925" y="598" class="ff field-val" text-anchor="middle">Drop your .csv here, or click to browse</text>
  <text x="925" y="614" class="ff muted" text-anchor="middle">Max 10MB · 1 file</text>

  <!-- Last upload status (real fake data) -->
  <line x1="528" y1="648" x2="1322" y2="648" stroke="#F4F2FB"/>
  <text x="528" y="678" class="ff h2">Last upload</text>
  <text x="1322" y="678" class="ff" font-size="13" fill="#0E8A4F" font-weight="600" text-anchor="end">✓ 243 of 332 patients imported</text>
  <rect x="528" y="690" width="794" height="8" rx="4" fill="#F4F2FB"/>
  <rect x="528" y="690" width="581" height="8" rx="4" fill="#7D7AF2"/>
  <text x="528" y="722" class="ff muted">Sample preview · all entries match the template format.</text>
  <text x="528" y="746" class="ff field-val">Member A50</text>
  <text x="704" y="746" class="ff muted">a50@household.local</text>
  <text x="920" y="746" class="ff muted">04— —— ——9</text>
  <text x="1322" y="746" class="ff ok" text-anchor="end">✓ Imported</text>
  <text x="528" y="766" class="ff field-val">Member A51</text>
  <text x="704" y="766" class="ff muted">a51@household.local</text>
  <text x="920" y="766" class="ff muted">04— —— ——3</text>
  <text x="1322" y="766" class="ff ok" text-anchor="end">✓ Imported</text>
</svg>
