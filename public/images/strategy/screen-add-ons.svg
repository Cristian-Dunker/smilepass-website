<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 800" role="img" aria-label="SmilePass Addons Builder">
  <defs>
    <style>
      .ff{font-family:'Inter','Helvetica Neue',Arial,sans-serif}
      .nav-mute{font-size:13px;fill:#7B789C;font-weight:400}
      .nav-active{font-size:13px;fill:#7D7AF2;font-weight:600}
      .h1{font-size:20px;fill:#252156;font-weight:600;letter-spacing:-.01em}
      .lbl{font-size:11px;fill:#5F5C7F;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
      .muted{font-size:11.5px;fill:#7B789C}
      .price{font-size:30px;fill:#252156;font-weight:700;letter-spacing:-.02em}
      .price-unit{font-size:13px;fill:#7B789C}
      .plan-name{font-size:17px;fill:#252156;font-weight:600;letter-spacing:-.005em}
      .toggle-label{font-size:11.5px;fill:#5F5C7F;font-weight:500}
      .bullet{font-size:12px;fill:#252156}
      .btn-text{font-size:12px;fill:#FFFFFF;font-weight:600;letter-spacing:.04em}
    </style>
  </defs>
  <rect width="1366" height="800" fill="#F6F4FB"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="232" height="800" fill="#FFFFFF"/>
  <rect x="32" y="32" width="32" height="32" rx="8" fill="#7D7AF2"/>
  <text x="74" y="56" class="ff" font-size="20" fill="#252156" font-weight="700">SmilePass</text>
  <text x="40" y="125" class="ff nav-mute">⌂ Home</text>
  <text x="40" y="173" class="ff nav-mute">⌽ Membership</text>
  <text x="40" y="213" class="ff nav-mute">$ Payment Plan</text>
  <text x="40" y="253" class="ff nav-mute">◔ Reporting</text>
  <text x="40" y="745" class="ff nav-mute">? Support</text>
  <rect x="20" y="755" width="192" height="40" rx="8" fill="#F1F0FD"/>
  <text x="40" y="780" class="ff nav-active">⚙ Settings</text>

  <!-- Top action bar -->
  <rect x="252" y="20" width="1094" height="56" rx="14" fill="#FFFFFF" stroke="#E5E3F0"/>
  <circle cx="290" cy="48" r="18" fill="#7D7AF2"/>
  <text x="290" y="54" class="ff" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">+</text>
  <rect x="1024" y="32" width="132" height="32" rx="16" fill="#7D7AF2"/>
  <text x="1090" y="52" class="ff" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">UPGRADE NOW</text>
  <text x="1248" y="44" class="ff" font-size="12" fill="#252156" font-weight="600">Dr Test</text>
  <text x="1248" y="58" class="ff" font-size="10" fill="#7B789C">Practice owner</text>

  <!-- Settings sub-sidebar -->
  <rect x="252" y="92" width="232" height="690" rx="14" fill="#FFFFFF" stroke="#E5E3F0"/>
  <text x="276" y="128" class="ff nav-mute">⌕ My Profile</text>
  <text x="276" y="168" class="ff nav-mute">⌽ Logins &amp; Permissions</text>
  <text x="276" y="208" class="ff nav-mute">⌂ Company</text>
  <text x="276" y="248" class="ff nav-mute">⌖ Locations</text>
  <text x="276" y="288" class="ff nav-mute">↥ Import Patients</text>
  <text x="276" y="328" class="ff nav-mute">✎ Membership Builder</text>
  <text x="276" y="368" class="ff nav-mute">✎ Payment Plan Builder</text>
  <rect x="272" y="386" width="192" height="36" rx="8" fill="#F1F0FD"/>
  <text x="288" y="409" class="ff nav-active">⊕ Addons Builder</text>
  <text x="276" y="448" class="ff nav-mute">⌖ Custom Discounts &amp; Code</text>
  <text x="276" y="488" class="ff nav-mute">▤ Billing and Payout</text>
  <text x="276" y="528" class="ff nav-mute">⛌ Promotional Material</text>
  <text x="276" y="568" class="ff nav-mute">⌬ Subscription</text>
  <text x="276" y="608" class="ff nav-mute">⊗ Integrations</text>

  <!-- Recommended Templates -->
  <rect x="504" y="92" width="842" height="156" rx="14" fill="#FFFFFF" stroke="#E5E3F0"/>
  <text x="528" y="124" class="ff h1">Recommended Templates</text>
  <rect x="528" y="144" width="200" height="88" rx="10" fill="#7D7AF2"/>
  <text x="628" y="184" class="ff" font-size="26" fill="#FFFFFF" font-weight="500" text-anchor="middle">+</text>
  <text x="628" y="210" class="ff" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Create New Addon</text>
  <!-- summary chip on right -->
  <rect x="1044" y="160" width="280" height="56" rx="10" fill="#F1F0FD"/>
  <text x="1064" y="184" class="ff" font-size="11" fill="#5F5C7F" font-weight="500" letter-spacing=".08em">ADD-ON MRR</text>
  <text x="1064" y="204" class="ff" font-size="18" fill="#252156" font-weight="600">$1,158</text>
  <text x="1140" y="204" class="ff" font-size="12" fill="#7B789C">/ month · 131 members</text>

  <!-- Search bar -->
  <rect x="504" y="264" width="842" height="44" rx="10" fill="#FFFFFF" stroke="#E5E3F0"/>
  <text x="528" y="290" class="ff" font-size="13" fill="#7B789C">Search Addon…</text>
  <text x="1326" y="290" class="ff" font-size="13" fill="#7B789C" text-anchor="end">⌕</text>

  <!-- 3 addon cards -->
  <!-- Card 1: Whitening Boost -->
  <rect x="504" y="324" width="270" height="436" rx="14" fill="#FFFFFF" stroke="#E5E3F0"/>
  <rect x="504" y="324" width="270" height="58" fill="#F4F2FB" rx="14"/>
  <rect x="504" y="366" width="270" height="16" fill="#F4F2FB"/>
  <text x="540" y="350" class="ff toggle-label">Accept New</text>
  <text x="540" y="366" class="ff toggle-label">Members</text>
  <rect x="694" y="342" width="40" height="22" rx="11" fill="#7D7AF2"/>
  <circle cx="723" cy="353" r="8" fill="#FFFFFF"/>
  <text x="540" y="412" class="ff muted">23 members</text>
  <text x="639" y="448" class="ff plan-name" text-anchor="middle">Whitening Boost</text>
  <text x="639" y="496" class="ff price" text-anchor="middle">$12.00</text>
  <text x="691" y="496" class="ff price-unit">/Week</text>
  <text x="540" y="544" class="ff bullet">✓ 2x take-home top-ups per year</text>
  <text x="540" y="566" class="ff bullet">✓ Free shade re-check at hygiene</text>
  <text x="540" y="588" class="ff bullet">✓ Discount on in-chair touch-up</text>
  <text x="540" y="610" class="ff bullet">✓ Free replacement trays at year 2</text>
  <line x1="540" y1="630" x2="738" y2="630" stroke="#F4F2FB"/>
  <text x="540" y="654" class="ff" font-size="11" fill="#5F5C7F">MRR contribution</text>
  <text x="738" y="654" class="ff" font-size="14" fill="#252156" font-weight="600" text-anchor="end">$276</text>
  <rect x="588" y="688" width="100" height="36" rx="8" fill="#7D7AF2"/>
  <text x="638" y="710" class="ff btn-text" text-anchor="middle">✎ EDIT</text>

  <!-- Card 2: Night Guard -->
  <rect x="788" y="324" width="270" height="436" rx="14" fill="#FFFFFF" stroke="#E5E3F0"/>
  <rect x="788" y="324" width="270" height="58" fill="#F4F2FB" rx="14"/>
  <rect x="788" y="366" width="270" height="16" fill="#F4F2FB"/>
  <text x="824" y="350" class="ff toggle-label">Accept New</text>
  <text x="824" y="366" class="ff toggle-label">Members</text>
  <rect x="978" y="342" width="40" height="22" rx="11" fill="#7D7AF2"/>
  <circle cx="1007" cy="353" r="8" fill="#FFFFFF"/>
  <text x="824" y="412" class="ff muted">41 members</text>
  <text x="923" y="448" class="ff plan-name" text-anchor="middle">Custom Night Guard</text>
  <text x="923" y="496" class="ff price" text-anchor="middle">$18.00</text>
  <text x="975" y="496" class="ff price-unit">/Week</text>
  <text x="824" y="544" class="ff bullet">✓ Custom impression, fitted in-chair</text>
  <text x="824" y="566" class="ff bullet">✓ Replacement every 24 months</text>
  <text x="824" y="588" class="ff bullet">✓ Annual occlusion check</text>
  <text x="824" y="610" class="ff bullet">✓ Free adjustments first year</text>
  <line x1="824" y1="630" x2="1022" y2="630" stroke="#F4F2FB"/>
  <text x="824" y="654" class="ff" font-size="11" fill="#5F5C7F">MRR contribution</text>
  <text x="1022" y="654" class="ff" font-size="14" fill="#252156" font-weight="600" text-anchor="end">$738</text>
  <rect x="872" y="688" width="100" height="36" rx="8" fill="#7D7AF2"/>
  <text x="922" y="710" class="ff btn-text" text-anchor="middle">✎ EDIT</text>

  <!-- Card 3: X-Ray pack -->
  <rect x="1072" y="324" width="270" height="436" rx="14" fill="#FFFFFF" stroke="#E5E3F0"/>
  <rect x="1072" y="324" width="270" height="58" fill="#F4F2FB" rx="14"/>
  <rect x="1072" y="366" width="270" height="16" fill="#F4F2FB"/>
  <text x="1108" y="350" class="ff toggle-label">Accept New</text>
  <text x="1108" y="366" class="ff toggle-label">Members</text>
  <rect x="1262" y="342" width="40" height="22" rx="11" fill="#7D7AF2"/>
  <circle cx="1291" cy="353" r="8" fill="#FFFFFF"/>
  <text x="1108" y="412" class="ff muted">67 members</text>
  <text x="1207" y="448" class="ff plan-name" text-anchor="middle">Annual X-Ray Pack</text>
  <text x="1207" y="496" class="ff price" text-anchor="middle">$8.00</text>
  <text x="1247" y="496" class="ff price-unit">/Week</text>
  <text x="1108" y="544" class="ff bullet">✓ Bitewings once per year</text>
  <text x="1108" y="566" class="ff bullet">✓ Annual OPG (panoramic)</text>
  <text x="1108" y="588" class="ff bullet">✓ Implant review x-ray if needed</text>
  <text x="1108" y="610" class="ff bullet">✓ Stored against patient record</text>
  <line x1="1108" y1="630" x2="1306" y2="630" stroke="#F4F2FB"/>
  <text x="1108" y="654" class="ff" font-size="11" fill="#5F5C7F">MRR contribution</text>
  <text x="1306" y="654" class="ff" font-size="14" fill="#252156" font-weight="600" text-anchor="end">$536</text>
  <rect x="1156" y="688" width="100" height="36" rx="8" fill="#7D7AF2"/>
  <text x="1206" y="710" class="ff btn-text" text-anchor="middle">✎ EDIT</text>
</svg>
